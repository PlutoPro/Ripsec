[package]
name = "ripsec-client"
version = "0.1.0"
edition = "2024"
description = "Post-quantum IKEv2/IPsec VPN client for Ripsec"
license = "MIT"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
ripsec-proto = { path = "../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"

[target.'cfg(windows)'.dependencies.windows-service]
version = "0.8"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
]
