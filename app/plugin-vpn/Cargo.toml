[package]
name = "tauri-plugin-ripsec-vpn"
version = "0.1.0"
edition = "2024"
description = "The Android half of the Ripsec app: VpnService, permission and file picking"
license = "MIT"
links = "tauri-plugin-ripsec-vpn"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
