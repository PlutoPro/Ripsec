[package]
name = "ripsec-app"
version = "0.1.0"
edition = "2024"
description = "Ripsec VPN"
license = "MIT"

# Its own workspace, so that building the server and client never needs a desktop toolkit.
[workspace]

[dependencies]
ripsec-client = { path = "../client" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
