name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (format, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: Windows (client, service and app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable; rustup default stable; rustup component add clippy rustfmt
      - run: cargo clippy -p ripsec-proto -p ripsec-client --all-targets --locked -- -D warnings
      - run: cargo test -p ripsec-proto -p ripsec-client --locked
      - run: cargo fmt --check
        working-directory: app
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app
      - run: cargo test --locked
        working-directory: app

  integration:
    name: Integration (real kernel IPsec)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Containers use the host kernel, and cannot load its modules themselves.
      - run: sudo modprobe -a xfrm_user esp4 tun
      - name: strongSwan against the server
        run: bash tests/interop/run.sh
      - name: Ripsec client against the server
        run: bash tests/client/run.sh
      - name: Sign in, enrol, connect and revoke with Keycloak
        run: python3 tests/e2e/portal.py
